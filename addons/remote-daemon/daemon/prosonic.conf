# remote-daemon config for the Prosonic BODRUM: "<key> <kind> [command]", see README.md.

# Backlight in 5 % steps on the 0-100 scale, snapped to the grid like the launcher's brighter/dimmer.
sh bl() { v=$(settings get global picture_backlight); case "$v" in ''|*[!0-9]*) return;; esac; if [ "$1" -gt 0 ]; then v=$(( v / 5 * 5 + 5 )); else v=$(( (v + 4) / 5 * 5 - 5 )); fi; [ $v -gt 100 ] && v=100; [ $v -lt 0 ] && v=0; settings put global picture_backlight $v; }
sh app() { am start -n "$1" >/dev/null 2>&1; }

# One volume step per press, also while held.
VOLUMEUP   smooth
VOLUMEDOWN smooth

CHANNELUP   repeat bl 1
CHANNELDOWN tap    bl -1
CHANNELDOWN hold   app io.github.luyzfernando08.sleeptimer/.BedtimeActivity

# The Netflix and Prime Video buttons (the remote sends them as PAGEUP and 504); both apps are disabled, so the
# TV's own start of them fails and these open Viu and Crunchyroll instead.
PAGEUP tap app com.viu.viuapp/.ui.MainActivity
504    tap app com.crunchyroll.crunchyroid/.splash.ui.SplashActivity

RED    tap app io.github.rasmuskd.huekeys/.Toggle
GREEN  tap app io.github.rasmuskd.huekeys/.Low
YELLOW tap app io.github.rasmuskd.huekeys/.Half
BLUE   tap app io.github.rasmuskd.huekeys/.Full
